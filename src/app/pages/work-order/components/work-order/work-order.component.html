
    <div class="row mt-3" [formGroup]="filter" >
        <div class="col-lg-1 filterClass">
            <div class="mrBtn d-flex justify-content-center">
                <ng-select [items]="shift" bindLabel="name" bindValue="name" [multiple]="true" formControlName="shift" placeholder="Shift" [clearable]="true" (change)="getShift(filter.value.shift)">
                </ng-select>
            </div>
        </div>
        <div class="col-lg-1 filterClass">
            <div class="mrBtn ">
                <ng-select [items]="user" bindLabel="name" bindValue="name" [multiple]="true" formControlName="user"
                    placeholder="User" [clearable]="true" (change)="users(filter.value.user)">
                </ng-select>
            </div>
        </div>
        <div class="col-lg-2">
            <div class="mrBtn">
                <ng-select [items]="noofPass" bindLabel="noofPass" bindValue="noofPass" [multiple]="true" formControlName="noofPass"
                    placeholder="No of Pass" [clearable]="true" (change)="noOfPass(filter.value.noofPass)">
                </ng-select>
            </div>
        </div>
        <div class="col-lg-2">
            <div class="mrBtn">
                <ng-select [items]="currentStatus" bindLabel="name" bindValue="name" [multiple]="true" formControlName="currentStatus"
                    placeholder="Current status" [clearable]="true" (change)="getCurrentStatus(filter.value.currentStatus)">
                </ng-select>
            </div>
        </div>
        <div class="col-lg-2">
            <mat-form-field class="full-width datePicker">
                <input #fromDateInput matInput [matDatepicker]="fromDatepicker"
                    placeholder="From date" formControlName="fromDate"
                    (dateChange)="onFromDateChange($event)">
                <mat-datepicker-toggle matSuffix [for]="fromDatepicker"></mat-datepicker-toggle>
                <mat-datepicker #fromDatepicker></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="col-lg-2">
            <mat-form-field class="full-width datePicker">
                <input #toDateInput matInput [matDatepicker]="toDatepicker" placeholder="To date"
                formControlName="toDate" (dateChange)="onToDateChange($event)">
                <mat-datepicker-toggle matSuffix [for]="toDatepicker"></mat-datepicker-toggle>
                <mat-datepicker #toDatepicker></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="col-lg-2">
            <app-search (searchData)="searchBox($event)"></app-search>
        </div>
    </div>
    <div class="mt-3">

        <app-scanner-table [tableHeaders]="tableHeaders" [tableValues]="tableValues"
        (viewDetail)="viewDetails($event)"></app-scanner-table>

        <ng-container *ngIf="apiLoader">
            <app-table-loader [valueColumns]="this.service.calculatePaginationVal()"
                [columns]="tableHeaders.length"></app-table-loader>
        </ng-container>
        <ng-container>

            <mat-paginator *ngIf="this.count>this.pageCount" #paginator [showFirstLastButtons]="true" class="demo-paginator" aria-label="Select page"
                [pageIndex]="currentPage" (page)="onPageChange($event)" [pageSize]="service.calculatePaginationVal()"
                [length]="totalCount">
            </mat-paginator>
        </ng-container>
    </div>
