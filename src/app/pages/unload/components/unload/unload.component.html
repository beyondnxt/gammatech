<div class="widthSet">
    <div class="tabs-align">
        <div class="wrapper">
            <div class="searchBar">
                <app-search (searchData)="searchBox($event)"></app-search>
            </div>
        </div>
    </div>
</div>
<div class="mt-3">
    <div class="row">
        <div class="col-lg-5">

            <app-scanner-table [tableHeaders]="tableHeaders" [tableValues]="tableValues"
                (detail)="openForm()"></app-scanner-table>

            <div *ngIf="showOrHide" class="no-data text-center py-3 bold-text">No Boxes Found</div>

            <ng-container *ngIf="apiLoader">
                <app-table-loader [valueColumns]="this.service.calculatePaginationVal()"
                    [columns]="tableHeaders.length"></app-table-loader>
            </ng-container>

            <mat-paginator *ngIf="this.totalCount>this.pageCount" #paginator [showFirstLastButtons]="true"
                class="demo-paginator" aria-label="Select page" [pageIndex]="currentPage" (page)="onPageChange($event)"
                [pageSize]="service.calculatePaginationVal()" [length]="totalCount">
            </mat-paginator>

        </div>
        <!-- <div class="col-lg-4"></div> -->
        <div class="col-lg-5" *ngIf="isShow">
            <div class="form-section">
                <app-form-data [data]="tableValues" [lable]="'Load'"
                    (loadToteBox)="loadToteBox($event)"></app-form-data>
            </div>
        </div>
    </div>

</div>
