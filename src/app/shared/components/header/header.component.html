<div class="header" [ngClass]="getHeaderClass()">
    <div class="col-lg-12">
        <div class="logo">
            <div class="company-logo">
            <!-- <img src="./../../../../assets/icons/kanam-logo.png" alt="" width="100"> -->
            <span class="company-name"></span>
        </div>
        <div class="user-logo">
            <!-- <img src="./../../../../assets/icons/user.png" alt=""> -->
            <span class="user-name">{{userName}}</span>

            <div class="head-menu-item notification-icon-container">
                <button class="head-menu-item-btn ripple" (click)="redirectToApprovalPage()">
                    <i class="far fa-bell menu-icon">
                        <div class="notification-count">{{this.notifyCount}}</div>
                    </i>
                </button>
            </div>

            <div class="dropdown head-menu-item">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                    <img src="./../../../../assets/icons/user.png" class="rounded-circle" height="15"
                        alt="Black and White Portrait of a Man" loading="lazy" style="filter: grayscale(100%) invert(100%); color: #ffffff;"/>
                </button>
                <mat-menu #menu="matMenu">
                    <div class="headerNav">
                        <div mat-menu-item (click)="logOut()" class="headerDiv logoutBorder">
                            <span class="headerMenu">
                                <mat-icon class="pt-1">exit_to_app</mat-icon><span>Logout</span>
                            </span>
                        </div>
                        <div mat-menu-item (click)="changePassword()" class="headerDiv">
                            <span class="headerMenu">
                                <mat-icon class="pt-1">vpn_key</mat-icon><span>Change Password</span>
                            </span>
                        </div>
                    </div>
                    <!-- <button mat-menu-item (click)="logOut()">
                      <mat-icon>exit_to_app</mat-icon>
                      <span>Logout</span>
                    </button>
                    <button mat-menu-item (click)="changePassword()">
                        <mat-icon>vpn_key</mat-icon>
                        <span>Change Password</span>
                      </button> -->
                </mat-menu>
            </div>

            <div class="dropdown head-menu-item">
                <button mat-icon-button [matMenuTriggerFor]="menu1" aria-label="Example icon-button with a menu">
                    <img src="./../../../../assets/icons/setting.png" class="rounded-circle" height="15"
                        alt="Black and White Portrait of a Man" loading="lazy" style="filter: grayscale(100%) invert(100%); color: #ffffff;"/>
                </button>
                <mat-menu #menu1="matMenu">
                    <div class="headerNav">
                        <div mat-menu-item class="headerDiv logoutBorder">
                            <span class="headerMenu">
                                <mat-icon class="pt-1">qr_code_scanner</mat-icon>
                                <mat-icon class="pt-1" [ngClass]="{ 'true-class': scanner1 === true, 'false-class': scanner1 === false }">looks_one</mat-icon>
                                <mat-icon class="pt-1" [ngClass]="{ 'true-class': scanner2 === true, 'false-class': scanner2 === false }">looks_two</mat-icon>
                                <mat-icon class="pt-1" [ngClass]="{ 'true-class': scanner3 === true, 'false-class': scanner3 === false }">looks_3</mat-icon>
                                <mat-icon class="pt-1" [ngClass]="{ 'true-class': scanner4 === true, 'false-class': scanner4 === false }">looks_4</mat-icon>
                            </span>
                        </div>
                        <div mat-menu-item (click)="connectScannerAndPort()" class="headerDiv">
                            <span class="headerMenu">
                                <mat-icon class="pt-1">device_hub</mat-icon><span>Scanner Connection</span>
                            </span>
                        </div>
                    </div>
                </mat-menu>
            </div>

        </div>
        </div>
    </div>
    
</div>
