<div class="col-lg-12 closeAlign head">
    <div>
        <p class="pt-3 pl">{{data.barcode}}</p>
    </div>
    <div>
        <button mat-icon-button mat-dialog-close tabindex="-1" class="close-button"><mat-icon
                class="closeColor">close</mat-icon></button>
    </div>
</div>
    <div class="row">
        <div class="col-lg-12">
            <div class="inTimeData">
                <table class="tableData">
                    <tr>
                        <th>In-Time</th>
                        <th>Out-Time</th>
                        <th>Current Pass</th>
                    </tr>
                    <tr *ngFor="let time of timeArr">
                        <td>{{time.scanner_two_in_time | date:'HH:mm:ss'}}</td>
                        <td>{{time.scanner_three_out_time | date:'HH:mm:ss'}}</td>
                        <td>{{time.pass_number}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
