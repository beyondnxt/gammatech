<div class="table-container">

  <table class="rwd-table">
    <tbody>
      <tr class="head-tr">
        <th *ngFor="let headers of tableHeaders">
          <ng-container *ngIf="headers.checkboxColumn; else headerCell">
            <mat-checkbox [(ngModel)]="isSelectAll" (change)="selectAllValues($event)"></mat-checkbox>
          </ng-container>
          <ng-template #headerCell>{{ headers.name }}</ng-template>
        </th>
      </tr>
      <ng-container *ngFor="let values of tableValues; let j=index">
        <tr>
          <ng-container *ngFor="let key of tableHeaders let i= index">
            <td>
              <ng-container *ngIf="key.key == 'checkBox'">
                <mat-checkbox [checked]="values['checked'] ? true : false"
                  (change)="onCheckboxChange($event,key.key,values.id)"></mat-checkbox>
              </ng-container>

              <ng-container *ngIf="key.type == 'boolean' ">
                <ng-container *ngIf="values[key.key] == true; else elseBlock">
                  <span><i class="fal fa-check"></i></span>
                </ng-container>
                <ng-template #elseBlock>
                  <div *ngIf="values[key.key] == false">
                    <span><i class="fal fa-times"></i></span>
                  </div>
                </ng-template>
              </ng-container>

              <ng-container *ngIf="key.type != 'boolean' && key.type != 'form' && key.type != 'noti'">
                <span>{{values[key.key]}}</span>
              </ng-container>

              <ng-container *ngIf="key.type=='noti'">
                <span
                  [contentEditable]="values['checked'] !== undefined ? values['checked'] : 'false'" class="editable" (input)="onSpanInput($event, key.key, values.id)">{{values[key.key]}}</span>
              </ng-container>

              <ng-container *ngIf="key.type=='form'">
                <span (click)="detail.emit()">{{values[key.key]}}</span>
              </ng-container>

              <ng-container *ngIf="key.edit">
                
                <span><img [title]="values.isEmpty === 'Loaded' ? 'Edit not allowed for this box' : 'Click to edit'"
                  [class.edit-icon]="values.isEmpty === 'Loaded'" src="./../../../../assets/icons/edit.svg" alt="" (click)="values.isEmpty != 'Loaded' ? edit.emit(values) : null" ></span>

                <span><img [title]="values.isEmpty === 'Loaded' ? 'Delete not allowed for this box' : 'Click to delete'"
                  [class.edit-icon]="values.isEmpty === 'Loaded'" style="margin-left: 10px;" src="./../../../../assets/icons/trash.svg" alt=""
                    (click)="values.isEmpty != 'Loaded' ? deleteItem.emit(values.id) : '' "></span>

              </ng-container>
              <ng-container *ngIf="key.viewDetail && values.timeArr.length>0">
                <span><img src="./../../../../assets/icons/eye.png" alt="" (click)="viewDetail.emit(values)"></span>
              </ng-container>

            </td>
          </ng-container>
        </tr>
      </ng-container>

    </tbody>
  </table>
</div>
